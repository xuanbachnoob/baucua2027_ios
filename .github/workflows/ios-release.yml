name: Build iOS & Upload TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      # ============================================================
      # 1. Checkout source
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v5

      # ============================================================
      # 2. Check Xcode
      # ============================================================
      - name: Check Xcode
        run: |
          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== IOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ============================================================
      # 3. Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version

      # ============================================================
      # 4. Install Flutter dependencies
      # ============================================================
      - name: Install Flutter dependencies
        run: |
          flutter pub get

      # ============================================================
      # 5. Install Apple Distribution Certificate
      # ============================================================
      - name: Install Apple Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"

          printf '%s' "$CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "ERROR: Certificate is empty."
            exit 1
          fi

          echo "Certificate:"
          ls -lh "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      # ============================================================
      # 6. Install Provisioning Profile
      # ============================================================
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/BauCua2027_AppStore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "ERROR: Provisioning profile is empty."
            exit 1
          fi

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          echo "===== PROVISIONING PROFILE ====="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM"
          echo "App ID: $PROFILE_APP_ID"

          if [ "$PROFILE_NAME" != "BauCua2027_AppStore" ]; then
            echo "ERROR: Unexpected provisioning profile."
            exit 1
          fi

          if [ "$PROFILE_TEAM" != "944TH6UDAS" ]; then
            echo "ERROR: Provisioning profile Team ID does not match."
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      # ============================================================
      # 7. Verify Distribution Certificate
      # ============================================================
      - name: Check signing identities
        run: |
          echo "===== SIGNING IDENTITIES ====="

          security find-identity \
            -v \
            -p codesigning

          if ! security find-identity \
            -v \
            -p codesigning \
            | grep -q "Apple Distribution"; then

            echo "ERROR: Apple Distribution certificate not found."
            exit 1
          fi

      # ============================================================
      # 8. Prepare Flutter project
      # ============================================================
      - name: Prepare Flutter iOS Build
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=2

      # ============================================================
      # 9. Configure signing ONLY on Runner target configurations
      # ============================================================
      - name: Configure Runner Signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          TEAM = "944TH6UDAS"
          PROFILE = "BauCua2027_AppStore"

          # These IDs come directly from this Flutter project's
          # PBXNativeTarget "Runner" configuration list.
          runner_configs = {
              "97C147061CF9000F007C117D": "Debug",
              "97C147071CF9000F007C117D": "Release",
              "249021D4217E4FDB00AE95B9": "Profile",
          }

          def patch_configuration(text, config_id, config_name):
              marker = f'{config_id} /* {config_name} */ = {{'

              start = text.find(marker)

              if start == -1:
                  raise RuntimeError(
                      f"Runner {config_name} configuration not found"
                  )

              build_settings_start = text.find(
                  "buildSettings = {",
                  start
              )

              if build_settings_start == -1:
                  raise RuntimeError(
                      f"buildSettings not found for Runner {config_name}"
                  )

              block_end = text.find(
                  "\n\t\t\t};",
                  build_settings_start
              )

              if block_end == -1:
                  raise RuntimeError(
                      f"End of buildSettings not found for Runner {config_name}"
                  )

              block = text[
                  build_settings_start:block_end
              ]

              # Only patch the real Runner target.
              if (
                  "PRODUCT_BUNDLE_IDENTIFIER = "
                  "com.baucua2027ios.game;"
                  not in block
              ):
                  raise RuntimeError(
                      f"{config_name} is not Runner app configuration"
                  )

              # Remove old signing settings from this Runner block.
              filtered = []

              for line in block.splitlines():
                  stripped = line.strip()

                  if stripped.startswith("CODE_SIGN_STYLE ="):
                      continue

                  if stripped.startswith("CODE_SIGN_IDENTITY ="):
                      continue

                  if stripped.startswith(
                      '"CODE_SIGN_IDENTITY[sdk=iphoneos*]"'
                  ):
                      continue

                  if stripped.startswith("DEVELOPMENT_TEAM ="):
                      continue

                  if stripped.startswith(
                      "PROVISIONING_PROFILE_SPECIFIER ="
                  ):
                      continue

                  if stripped.startswith("PROVISIONING_PROFILE ="):
                      continue

                  filtered.append(line)

              # Insert signing settings immediately after
              # buildSettings = {
              new_block = "\n".join(filtered)

              insertion = (
                  "\n"
                  "\t\t\t\tCODE_SIGN_IDENTITY = "
                  '"Apple Distribution";\n'
                  "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
                  f"\t\t\t\tDEVELOPMENT_TEAM = {TEAM};\n"
                  "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "
                  f'"{PROFILE}";'
              )

              new_block = new_block.replace(
                  "buildSettings = {",
                  "buildSettings = {" + insertion,
                  1
              )

              return (
                  text[:build_settings_start]
                  + new_block
                  + text[block_end:]
              )

          # Release is what Archive uses.
          text = patch_configuration(
              text,
              runner_configs["97C147071CF9000F007C117D"]
              if False else "97C147071CF9000F007C117D",
              "Release"
          )

          # Profile is also configured for consistency.
          text = patch_configuration(
              text,
              "249021D4217E4FDB00AE95B9",
              "Profile"
          )

          path.write_text(text)

          print("Runner Release/Profile signing configured.")
          PY

      # ============================================================
      # 10. Verify Runner signing configuration
      # ============================================================
      - name: Verify Runner Signing
        run: |
          echo "===== RUNNER RELEASE BUILD SETTINGS ====="

          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER"

          echo "===== CHECK REQUIRED VALUES ====="

          SETTINGS=$(
            xcodebuild \
              -project ios/Runner.xcodeproj \
              -target Runner \
              -configuration Release \
              -showBuildSettings
          )

          echo "$SETTINGS" \
            | grep -q \
            "PRODUCT_BUNDLE_IDENTIFIER = com.baucua2027ios.game"

          echo "$SETTINGS" \
            | grep -q \
            "DEVELOPMENT_TEAM = 944TH6UDAS"

          echo "$SETTINGS" \
            | grep -q \
            "CODE_SIGN_STYLE = Manual"

          echo "$SETTINGS" \
            | grep -q \
            "PROVISIONING_PROFILE_SPECIFIER = BauCua2027_AppStore"

          echo "Runner signing configuration is valid."

      # ============================================================
      # 11. Archive iOS application
      #
      # IMPORTANT:
      # No signing settings are passed globally here.
      # Firebase / gRPC / other packages will therefore NOT receive
      # Runner's provisioning profile.
      # ============================================================
      - name: Archive iOS App
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/BauCua2027.xcarchive"

          echo "===== ARCHIVING ====="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION=2 \
            MARKETING_VERSION=1.0.0 \
            clean archive

          echo "===== ARCHIVE CREATED ====="

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          ls -lah "$ARCHIVE_PATH"

      # ============================================================
      # 12. Create ExportOptions.plist
      # ============================================================
      - name: Create Export Options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>944TH6UDAS</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.baucua2027ios.game</key>
                  <string>BauCua2027_AppStore</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          echo "===== EXPORT OPTIONS ====="
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # ============================================================
      # 13. Export IPA
      # ============================================================
      - name: Export IPA
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/BauCua2027.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/BauCua2027Export"

          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "===== EXPORTED FILES ====="

          find "$EXPORT_PATH" \
            -maxdepth 2 \
            -type f \
            -print

      # ============================================================
      # 14. Find IPA
      # ============================================================
      - name: Check IPA
        run: |
          IPA_PATH=$(
            find "$RUNNER_TEMP/BauCua2027Export" \
              -type f \
              -name "*.ipa" \
              | head -1
          )

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          mkdir -p build/ios/ipa

          cp "$IPA_PATH" \
            build/ios/ipa/BauCua2027.ipa

          echo "===== IPA GENERATED ====="
          ls -lh build/ios/ipa/BauCua2027.ipa

      # ============================================================
      # 15. Save IPA as GitHub Artifact
      # ============================================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BauCua2027-iOS
          path: build/ios/ipa/BauCua2027.ipa
          if-no-files-found: error

      # ============================================================
      # 16. Prepare App Store Connect API Key
      # ============================================================
      - name: Prepare App Store Connect API Key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p \
            "$HOME/.appstoreconnect/private_keys"

          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "$ASC_PRIVATE_KEY" \
            > "$KEY_PATH"

          chmod 600 "$KEY_PATH"

          if [ ! -s "$KEY_PATH" ]; then
            echo "ERROR: App Store Connect API key is empty."
            exit 1
          fi

          echo "App Store Connect API key prepared."

      # ============================================================
      # 17. Upload to App Store Connect / TestFlight
      # ============================================================
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH="build/ios/ipa/BauCua2027.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          echo "===== UPLOADING TO APP STORE CONNECT ====="

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "===== UPLOAD FINISHED ====="
