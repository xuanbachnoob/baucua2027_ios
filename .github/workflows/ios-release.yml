name: Build iOS & Upload TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      # ==========================================
      # 1. Checkout source
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v5

      # ==========================================
      # 2. Check Xcode / iOS SDK
      # ==========================================
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================
      # 3. Setup Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ==========================================
      # 4. Install Flutter dependencies
      # ==========================================
      - name: Install dependencies
        run: flutter pub get

      # ==========================================
      # 5. Install Apple Distribution Certificate
      # ==========================================
      - name: Install Apple Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

      # ==========================================
      # 6. Install Provisioning Profile
      # ==========================================
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(
            security cms -D -i "$PROFILE_PATH" \
            | /usr/libexec/PlistBuddy \
            -c "Print UUID" /dev/stdin
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning Profile installed:"
          echo "$PROFILE_UUID"

      # ==========================================
      # 7. Show signing identities
      # ==========================================
      - name: Check signing identities
        run: |
          security find-identity -v -p codesigning

      # ==========================================
      # 8. Build signed IPA
      # ==========================================
      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=1

      # ==========================================
      # 9. Save IPA as GitHub artifact
      # ==========================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BauCua2027-iOS
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # ==========================================
      # 10. Prepare App Store Connect API Key
      # ==========================================
      - name: Prepare App Store Connect API Key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$ASC_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # ==========================================
      # 11. Upload IPA to App Store Connect
      # ==========================================
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa \
            -type f \
            -name "*.ipa" \
            | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA file not found."
            exit 1
          fi

          echo "Uploading:"
          echo "$IPA_PATH"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
