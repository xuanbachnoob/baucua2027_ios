name: Build iOS & Upload TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      # ============================================================
      # 1. Checkout source
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v5

      # ============================================================
      # 2. Check Xcode / iOS SDK
      # ============================================================
      - name: Check Xcode
        run: |
          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== IOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ============================================================
      # 3. Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ============================================================
      # 4. Install Flutter dependencies
      # ============================================================
      - name: Install dependencies
        run: flutter pub get

      # ============================================================
      # 5. Install Apple Distribution Certificate
      # ============================================================
      - name: Install Apple Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"

          printf '%s' "$CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          echo "Certificate size:"
          ls -lh "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      # ============================================================
      # 6. Install Provisioning Profile
      # ============================================================
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/BauCua2027_AppStore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "ERROR: Provisioning Profile is empty."
            exit 1
          fi

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          echo "===== PROFILE ====="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM"
          echo "App ID: $PROFILE_APP_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      # ============================================================
      # 7. Verify signing identity
      # ============================================================
      - name: Check signing identities
        run: |
          security find-identity -v -p codesigning

          if ! security find-identity -v -p codesigning \
            | grep -q "Apple Distribution"; then
            echo "ERROR: Apple Distribution certificate not found."
            exit 1
          fi

      # ============================================================
      # 8. Prepare Flutter iOS files WITHOUT signing
      # ============================================================
      - name: Prepare Flutter iOS Build
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=1

      # ============================================================
      # 9. Configure ONLY Runner target for manual signing
      # ============================================================
      - name: Configure Runner signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          bundle_id = "com.baucua2027ios.game"
          team_id = "944TH6UDAS"
          profile = "BauCua2027_AppStore"

          # Add / replace DEVELOPMENT_TEAM on Runner build configs
          text = re.sub(
              r'DEVELOPMENT_TEAM = [A-Z0-9]+;',
              f'DEVELOPMENT_TEAM = {team_id};',
              text
          )

          # Change Runner signing style to Manual
          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          # Ensure Runner configs have provisioning profile
          lines = text.splitlines()
          result = []
          in_build_settings = False
          runner_bundle_seen = False

          for line in lines:
              stripped = line.strip()

              if stripped == 'buildSettings = {':
                  in_build_settings = True
                  runner_bundle_seen = False

              if in_build_settings and \
                 f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};' in stripped:
                  runner_bundle_seen = True

              if in_build_settings and stripped == '};':
                  if runner_bundle_seen:
                      indent = line[:len(line) - len(line.lstrip())]

                      block = "\n".join(result[-40:])

                      if "PROVISIONING_PROFILE_SPECIFIER" not in block:
                          result.append(
                              f'{indent}\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";'
                          )

                      if "CODE_SIGN_IDENTITY" not in block:
                          result.append(
                              f'{indent}\tCODE_SIGN_IDENTITY = "Apple Distribution";'
                          )

                  in_build_settings = False
                  runner_bundle_seen = False

              result.append(line)

          path.write_text("\n".join(result) + "\n")
          PY

          echo "===== RUNNER SIGNING SETTINGS ====="
          grep -n \
            "PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj

      # ============================================================
      # 10. Archive
      # IMPORTANT:
      # Do NOT pass provisioning profile globally here.
      # ============================================================
      - name: Archive iOS App
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/BauCua2027.xcarchive"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION=1 \
            MARKETING_VERSION=1.0.0 \
            clean archive

          echo "===== ARCHIVE CREATED ====="
          ls -lah "$ARCHIVE_PATH"

      # ============================================================
      # 11. Create ExportOptions.plist
      # ============================================================
      - name: Create Export Options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>944TH6UDAS</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.baucua2027ios.game</key>
                  <string>BauCua2027_AppStore</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          cat "$RUNNER_TEMP/ExportOptions.plist"

      # ============================================================
      # 12. Export IPA
      # ============================================================
      - name: Export IPA
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/BauCua2027.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/BauCua2027Export"

          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "===== EXPORTED FILES ====="
          find "$EXPORT_PATH" -maxdepth 2 -type f -print

      # ============================================================
      # 13. Copy IPA
      # ============================================================
      - name: Check IPA
        run: |
          IPA_PATH=$(
            find "$RUNNER_TEMP/BauCua2027Export" \
              -type f \
              -name "*.ipa" \
              | head -1
          )

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          mkdir -p build/ios/ipa

          cp "$IPA_PATH" \
            build/ios/ipa/BauCua2027.ipa

          echo "===== IPA ====="
          ls -lh build/ios/ipa/BauCua2027.ipa

      # ============================================================
      # 14. Save IPA artifact
      # ============================================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BauCua2027-iOS
          path: build/ios/ipa/BauCua2027.ipa
          if-no-files-found: error

      # ============================================================
      # 15. Prepare App Store Connect API key
      # ============================================================
      - name: Prepare App Store Connect API Key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"

          chmod 600 "$KEY_PATH"

          if [ ! -s "$KEY_PATH" ]; then
            echo "ERROR: API key is empty."
            exit 1
          fi

      # ============================================================
      # 16. Upload to App Store Connect / TestFlight
      # ============================================================
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH="build/ios/ipa/BauCua2027.ipa"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "===== UPLOAD FINISHED ====="
